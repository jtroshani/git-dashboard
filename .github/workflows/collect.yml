name: Collect site visits

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch site visits
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a TRAFFIC_TOKEN repository secret (a token that can read traffic on your repos)."
            exit 1
          fi
          python3 collect.py
      - name: Commit data
        run: |
          git config user.name "Jetmir Troshani"
          git config user.email "jtroshani@gmail.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update site visits"
          git push
