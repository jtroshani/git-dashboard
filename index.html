<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo Traffic</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f5f5f3; --surface-1: #fcfcfb; --border: #e4e3de; --grid: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
  --series-1: #2a78d6; --series-2: #eb6834; --accent-bg: #e8f0fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-2: #d95926; --accent-bg: #1c2a3d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --series-1: #3987e5; --series-2: #d95926; --accent-bg: #1c2a3d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
.seg { display: inline-flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--text-secondary); font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--text-primary); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
.tile { padding: 14px 16px; }
.tile .label { color: var(--text-secondary); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.tile .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile .note { color: var(--text-muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.card { padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: center; gap: 6px; }
.card .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--text-muted); font-size: 11px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--text-secondary); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; }
thead tr.group th { cursor: default; text-align: center; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 0; padding-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-0); }
tbody tr.sel { background: var(--accent-bg); }
td.zero { color: var(--text-muted); }
td.cur, th.cur { font-weight: 600; }
td a { color: var(--text-primary); text-decoration: none; }
td a:hover { text-decoration: underline; }
th.about { text-align: left; cursor: default; }
td.about { text-align: left; white-space: normal; min-width: 220px; max-width: 300px; color: var(--text-secondary); font-size: 12px; line-height: 1.4; }
.refs { color: var(--text-secondary); font-size: 12px; white-space: normal; text-align: left; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 5; }
.tip b { font-variant-numeric: tabular-nums; }
.foot { color: var(--text-muted); font-size: 12px; margin-top: 14px; }
.filter { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; min-height: 18px; }
.filter button { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); border-radius: 6px; padding: 1px 8px; cursor: pointer; margin-left: 6px; }
@media (max-width: 760px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .charts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>GitHub repo traffic</h1>
      <div class="sub" id="meta"></div>
    </div>
    <div class="seg" role="group" aria-label="Period" id="periods">
      <button data-p="day">Daily</button>
      <button data-p="week">Weekly</button>
      <button data-p="month">Monthly</button>
      <button data-p="year">Yearly</button>
    </div>
  </header>

  <div class="filter" id="filter"></div>
  <section class="tiles" id="tiles"></section>

  <section class="charts">
    <div class="card"><h2><span class="dot" style="background:var(--series-1)"></span>Views per day</h2><div class="hint" id="h1"></div><svg id="c-views"></svg></div>
    <div class="card"><h2><span class="dot" style="background:var(--series-2)"></span>Clones per day</h2><div class="hint" id="h2"></div><svg id="c-clones"></svg></div>
  </section>

  <section class="card">
    <h2>By repository</h2>
    <div class="hint">Click a name to open its site; click elsewhere in a row to filter the charts. Click a column header to sort.</div>
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>

  <p class="foot" id="foot"></p>
</main>
<div class="tip" id="tip"></div>

<script>document.write('<script src="data/data.js?v=' + Date.now() + '"><\/script>');</script>
<script>
const D = window.TRAFFIC;
const PERIODS = { day: 1, week: 7, month: 30, year: 365 };
const PLABEL = { day: "Daily", week: "Weekly", month: "Monthly", year: "Yearly" };
const PDESC = { day: "latest full day", week: "last 7 days", month: "last 30 days", year: "last 365 days" };
let period = "week", selected = null, sortKey = "clones:week", sortDir = -1;
try { period = localStorage.getItem("period") || period; } catch (e) {}
sortKey = "clones:" + period;

const fmt = n => n.toLocaleString();
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); };

const repos = Object.keys(D.repos).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
const allDates = repos.flatMap(r => Object.keys(D.repos[r].days));
const firstDate = allDates.reduce((a, b) => a < b ? a : b);
// Anchor on the last full UTC day: GitHub's "today" is still filling in.
const lastData = allDates.reduce((a, b) => a > b ? a : b);
const todayUTC = iso(new Date());
const anchor = lastData >= todayUTC ? addDays(todayUTC, -1) : lastData;

function range(p) { const n = PERIODS[p]; return [addDays(anchor, -(n - 1)), anchor]; }
function sum(names, p, key) {
  const [from, to] = range(p); let t = 0;
  for (const r of names) for (const [d, v] of Object.entries(D.repos[r].days))
    if (d >= from && d <= to) t += v[key] || 0;
  return t;
}
function series(names, p, key) {
  const n = Math.max(PERIODS[p], 14); const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = addDays(anchor, -i); let t = 0;
    for (const r of names) t += (D.repos[r].days[d] || {})[key] || 0;
    out.push({ d, v: t, collected: d >= firstDate });
  }
  return out;
}

const tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY + 12) + "px";
}
const hideTip = () => tip.style.display = "none";

function chart(svg, data, color, label) {
  const W = svg.clientWidth || 500, H = 180, L = 32, B = 20, T = 8;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const max = Math.max(1, ...data.map(x => x.v));
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  let top = Math.ceil(max / step) * step;
  if (top % 2) top += step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L) / data.length, gap = Math.min(2, bw * 0.2);
  let s = "";
  for (const g of [0, top / 2, top]) {
    s += `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--grid)"/>`;
    s += `<text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${fmt(Math.round(g))}</text>`;
  }
  const ticks = [0, Math.floor(data.length / 2), data.length - 1];
  data.forEach((pt, i) => {
    const x = L + i * bw, h = y(0) - y(pt.v), w = Math.max(1, bw - gap);
    if (pt.v > 0) {
      const r = Math.min(4, w / 2, h);
      s += `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${w - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${color}"/>`;
    }
    if (!pt.collected) s += `<rect x="${x}" y="${T}" width="${w}" height="${H - T - B}" fill="var(--grid)" opacity=".5"/>`;
    s += `<rect x="${x}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-i="${i}"/>`;
    if (ticks.includes(i)) s += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === data.length - 1 ? "end" : "middle"}">${pt.d.slice(5)}</text>`;
  });
  svg.innerHTML = s;
  svg.onmousemove = e => {
    const i = e.target.dataset && e.target.dataset.i; if (i === undefined) return hideTip();
    const pt = data[i];
    showTip(e, `${pt.d}<br>${label}: <b>${pt.collected ? fmt(pt.v) : "not collected"}</b>`);
  };
  svg.onmouseleave = hideTip;
}

function render() {
  document.querySelectorAll("#periods button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === period));
  const names = selected ? [selected] : repos;
  const [from, to] = range(period);
  document.getElementById("meta").textContent =
    `${D.owner} · ${repos.length} repositories · ${PLABEL[period]}: ${from === to ? to : from + " → " + to} (UTC)`;
  document.getElementById("filter").innerHTML = selected
    ? `Showing <b>${selected}</b><button id="clr">Show all repos</button>` : "Showing all repositories";
  if (selected) document.getElementById("clr").onclick = () => { selected = null; render(); };

  const partial = from < firstDate ? `<div class="note">History starts ${firstDate}</div>` : `<div class="note">${PDESC[period]}</div>`;
  const tiles = [
    ["Views", "views", "var(--series-1)"], ["Unique visitors", "visitors", "var(--series-1)"],
    ["Clones", "clones", "var(--series-2)"], ["Unique cloners", "cloners", "var(--series-2)"],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([l, k, c]) =>
    `<div class="tile"><div class="label"><span class="dot" style="background:${c}"></span>${l}</div><div class="value">${fmt(sum(names, period, k))}</div>${partial}</div>`).join("");

  const n = Math.max(PERIODS[period], 14);
  document.getElementById("h1").textContent = document.getElementById("h2").textContent =
    `Last ${n} days${n > 14 ? " · shaded days were before collection started" : ""}`;
  chart(document.getElementById("c-views"), series(names, period, "views"), "var(--series-1)", "Views");
  chart(document.getElementById("c-clones"), series(names, period, "clones"), "var(--series-2)", "Clones");

  // Table: views + clones for all four periods, current period emphasised.
  const ps = Object.keys(PERIODS);
  const rows = repos.map(r => {
    const o = { name: r };
    for (const p of ps) { o["views:" + p] = sum([r], p, "views"); o["clones:" + p] = sum([r], p, "clones"); }
    const refs = D.repos[r].referrers || [];
    o.refs = refs.slice(0, 3).map(x => `${x.referrer} (${x.count})`).join(", ");
    return o;
  });
  rows.sort((a, b) => sortKey === "name" ? sortDir * a.name.localeCompare(b.name) : sortDir * (a[sortKey] - b[sortKey]) || a.name.localeCompare(b.name));
  const arrow = k => k === sortKey ? (sortDir < 0 ? " ↓" : " ↑") : "";
  const cols = m => ps.map(p => `<th data-k="${m}:${p}" class="${p === period ? "cur" : ""}">${PLABEL[p]}${arrow(m + ":" + p)}</th>`).join("");
  let h = `<thead><tr class="group"><th></th><th></th><th colspan="4">Views</th><th colspan="4">Clones</th><th></th></tr>
    <tr><th data-k="name">Repository${arrow("name")}</th><th class="about">What it is</th>${cols("views")}${cols("clones")}<th style="text-align:left;cursor:default">Top referrers (14 d)</th></tr></thead><tbody>`;
  for (const o of rows) {
    const cell = k => `<td class="${o[k] ? "" : "zero"} ${k.endsWith(":" + period) ? "cur" : ""}">${fmt(o[k])}</td>`;
    h += `<tr data-r="${o.name}" class="${o.name === selected ? "sel" : ""}"><td><a href="${D.repos[o.name].site || D.repos[o.name].url}" target="_blank" rel="noopener">${o.name}</a></td>
      <td class="about">${D.repos[o.name].about || D.repos[o.name].description || "—"}</td>
      ${ps.map(p => cell("views:" + p)).join("")}${ps.map(p => cell("clones:" + p)).join("")}
      <td class="refs">${o.refs || "—"}</td></tr>`;
  }
  const tot = k => ps.map(p => `<td class="${p === period ? "cur" : ""}"><b>${fmt(sum(repos, p, k))}</b></td>`).join("");
  h += `</tbody><tfoot><tr><td><b>Total</b></td><td></td>${tot("views")}${tot("clones")}<td></td></tr></tfoot>`;
  const tbl = document.getElementById("tbl"); tbl.innerHTML = h;
  tbl.querySelectorAll("thead th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k; sortDir = k === sortKey ? -sortDir : (k === "name" ? 1 : -1); sortKey = k; render();
  });
  tbl.querySelectorAll("tbody tr").forEach(tr => tr.onclick = e => {
    if (e.target.closest("a")) return;
    selected = selected === tr.dataset.r ? null : tr.dataset.r; render();
  });

  document.getElementById("foot").innerHTML =
    `Data from the GitHub traffic API, last collected ${new Date(D.updated).toLocaleString()}. ` +
    `GitHub keeps only 14 days, so monthly and yearly totals include only days collected since ${firstDate}. ` +
    `Visitor and cloner counts add up each day's unique count, so one person who returns on several days is counted once per day. ` +
    `Updated daily by a GitHub Action; this page reloads itself when new data arrives.`;
}

document.querySelectorAll("#periods button").forEach(b => b.onclick = () => {
  period = b.dataset.p; try { localStorage.setItem("period", period); } catch (e) {}
  if (sortKey.includes(":")) sortKey = sortKey.split(":")[0] + ":" + period;
  render();
});
addEventListener("resize", render);
render();

// Reload when the daily collection publishes new data (checked every 30 min
// and whenever the tab becomes visible again).
async function checkForUpdate() {
  try {
    const txt = await (await fetch("data/data.js?v=" + Date.now(), { cache: "no-store" })).text();
    const m = txt.match(/"updated": "([^"]+)"/);
    if (m && m[1] !== D.updated) location.reload();
  } catch (e) {}
}
setInterval(checkForUpdate, 30 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
</script>
</body>
</html>
